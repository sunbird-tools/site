name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # sunbird-tools/sunbird redeploys assets.sunbird.tools on every push to main. The check job
  # compares its site.tar.gz Last-Modified with the deployed one and skips the build if equal.
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      stale: ${{ steps.release.outputs.stale }}
    steps:
      - id: release
        run: |
          release=$(curl -fsSI https://assets.sunbird.tools/site.tar.gz | tr -d '\r' | sed -n 's/^last-modified: //Ip')
          deployed=$(curl -fsS https://sunbird.tools/release.txt || true)
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "stale=$([ "$release" != "$deployed" ] || [ "${{ github.event_name }}" != schedule ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  build:
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: |
          mkdir -p staging public && curl -fsSL https://assets.sunbird.tools/site.tar.gz | tar xz -C staging
          mv staging/pkg src/pkg && mv staging/plugins staging/version.json public/
          echo -n '${{ needs.check.outputs.release }}' > public/release.txt
      - uses: actions/cache@v4
        with:
          path: .cache/data-store.json
          key: astro-data-${{ github.run_id }}
          restore-keys: astro-data-
      - run: |
          nix develop --command bash -euo pipefail -c '
            pnpm install --frozen-lockfile
            pnpm lint
            pnpm format:check
            pnpm check
            pnpm build
          '
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
